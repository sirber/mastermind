services:
  app:
    build:
      context: .
      target: development-dependencies-env
    user: '${UID:-1000}:${GID:-1000}'
    restart: unless-stopped
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - node_modules:/usr/src/app/node_modules
    ports:
      - '5173:5173'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://dev:devpass@db:5432/devdb?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-local-development-secret-replace-before-deploying}
    command: ['sh', '-c', 'bunx prisma generate && bun run dev -- --host 0.0.0.0']
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: devdb
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dev -d devdb']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  node_modules:
